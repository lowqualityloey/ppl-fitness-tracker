name: Test Suite

# Cost control, added 2026-09-21 — **free: no plan change, no payment method, nothing subscribed**.
# No card is filed for this change; the measurement it acts on is recorded in
# `docs/releases/ci-triage/ci-cost-measurement.md`, and the failure it responds to in
# `docs/releases/ci-triage/CI-github-35555062183.md`.
#
# Context: CI stopped starting altogether. Four runs across two revisions, every one of them
# `steps: 0` in ~2 s, on GitHub's account-billing annotation (see
# `docs/releases/ci-triage/CI-github-35555062183.md`). The account condition is why those runs
# failed; this file is why the allowance ran out in the first place. Measured across all 227 runs
# this repo has ever created (2026-09-07 → 2026-09-21, nothing excluded):
#
#   total runner wall-clock ....... 2,279 minutes
#   docs-only pushes ..............   700 min / 64 runs   <- skipped below by `paths-ignore`
#   superseded by a newer run .....   266 min / 28 runs   <- cancelled below by `concurrency`
#     ...of which 96 min was ALSO docs-only, so the two fixes overlap and the honest
#        combined saving is ~34%, not their sum (38%).
#
# Both buckets were pure waste: a commit that only touches markdown cannot change a test outcome
# or a type, and a run superseded by a newer run on the same ref is grading a revision nobody
# will ever ship.
#
# `paths-ignore` is safe to apply to BOTH events here because `main` carries no protection — the
# API reports "Branch not protected" with an empty ruleset list — so a path-skipped workflow
# cannot leave a pull request stuck waiting on a required check that will never report. **If a
# ruleset is ever added to `main`, revisit this:** with `paths-ignore` on `pull_request`, a
# docs-only PR then reports *no* checks at all, which reads as pending rather than as passing.
#
# No test or script reads anything under `docs/` at runtime (verified: every `docs/` reference in
# `tests/` is a provenance comment), so nothing is silently unverified by the ignore list.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# One run in flight per ref, so a newer push stops the older run instead of letting both finish.
#
# Cancelling does NOT refund minutes already spent — GitHub bills elapsed time per job — so the
# saving is the *remainder*, which is where the 266-minute figure comes from rather than from a
# naive count of whole runs.
#
# `cancel-in-progress` is deliberately **PR-only**. Cancelling on `main` would have reclaimed
# another 110 min, but every one of those runs was a **code** revision, and cancelling it means
# that revision ends `cancelled` instead of getting a verdict — which breaks the property that
# every code revision on `main` has a CI result, and `docs/STATE.md` cites `main`'s last
# CI-green revision by SHA. Reclaiming those 110 minutes is a one-line change
# (`cancel-in-progress: true`) and a deliberate, reversible trade — not an oversight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    # Job-level so every DB-backed step gets the same credentials. These were
    # previously inline on a single `npm test` step, which meant any additional
    # suite had to duplicate the whole block (and silently could not, if someone
    # forgot) — see D5 in docs/tasks/2026-09-11-intake-debt-index.md.
    env:
      # Supabase local development URLs (ADR-0003):
      #   DATABASE_URL routes through the pooler (54329), matching production.
      #   MIGRATION_DATABASE_URL connects directly as owner (54322) — the
      #   pooler requires a tenant identifier that a bare owner connection
      #   does not carry, so migrations/seeds must bypass it.
      # The app-role password is this repo's own literal from migration
      # 0001_app_authenticated_role_trigger.sql, not a Supabase-generated one,
      # so it must be kept in sync with that file. `test:api:preflight` asserts it.
      DATABASE_URL: postgresql://app_authenticated.pooler-dev:Wd7EmwRWWqY9s7jMVD3kVqnt+OaW5PowxNIxCY5Ful0=@127.0.0.1:54329/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Well-known Supabase local-dev defaults (public by design, safe to
      # commit — see .env.example). Needed by tests/integration/require-user.test.ts.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      # Pre-existing latent gap surfaced by M4-24 (#142) AC-2: the sign-in form's POST to
      # /auth/signin throws 'NEXT_PUBLIC_APP_URL must be configured' (lib/auth/magic-link.ts
      # confirmUrl()) without it — an empty-body 500. Nothing caught it because the whole
      # e2e battery authenticates via GoTrue cookies (tests/e2e/auth.ts) and no spec had
      # ever submitted the real form. Role matches .env.example (the app's own origin);
      # the port is the battery's baseURL (playwright.config.ts).
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, deliberately. `tests/e2e/legacy-parity.spec.ts` diffs the
          # branch against `origin/main` to prove M3 touched no legacy module — and
          # checkout's default `fetch-depth: 1` leaves no `origin/main` ref and no
          # merge base in the runner at all. That is how CI proved (run 34633596241)
          # the gate as first written only ran on one machine. The spec now skips
          # loudly when no base resolves, but a *skipped* parity gate is still an
          # unwatched claim — fetch the history so it actually executes here too.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22+ needed for native WebSocket, which @supabase/supabase-js's
          # bundled realtime client requires even though this project
          # doesn't use realtime. 24 matches the local dev environment
          # (see docs/STATE.md §5, node runtime).
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint runs first: it needs no stack and no database, so it is the cheapest place
      # to catch a discipline break. This workflow had no lint step at all, which is how
      # `npm run lint` came to sit red with 24 `no-explicit-any` errors while
      # PROMPTKIT.md §6 forbids them — a declared control with no runner is not a
      # control. `npm run lint` now passes --max-warnings=0, so warnings fail too
      # instead of accumulating into a tolerated background hum.
      #
      # Merge note: if this lands alongside the branch that adds the API-suite step, the
      # two touch the same region of this file. Both changes are additive; keep this step
      # directly after `npm ci`.
      - name: Lint
        run: npm run lint

      # Same stack the repo develops against locally (`npm run db:up`). CI previously
      # booted the full stack — including six services nothing here uses (verified
      # 2026-10-23 across `src/`, `lib/`, `db/`, `scripts/`, `tests/`): Storage,
      # Realtime, Edge Runtime, Logflare, Vector, and the imgproxy in front of Storage.
      # `mailpit` stays: `supabase/config.toml` enables `[local_smtp]`, and a sign-in
      # path that enqueues mail fails without its SMTP target. Excluding these matches
      # `db:up` exactly, so a suite that needed one would already fail locally first.
      - name: Start Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector

      - name: Run type check
        run: npm run typecheck

      - name: Security check - Ban direct set_config calls
        run: ./scripts/check-set-config.sh

      # Separate step, before the suites, so that an environment problem is
      # attributable on its own rather than appearing as N status-code
      # assertions. This is the check that would have distinguished the
      # 2026-09-11 local incident (unfilled app-role credential -> blanket
      # HTTP 500s) from a genuine code regression.
      - name: Preflight integration environment
        run: npm run test:api:preflight

      - name: Run test suite (includes schema drift detection)
        run: npm test

      # The route-handler suites under tests/integration/api/ stay out of
      # `npm test` — they boot a `next dev` server and need the live stack, so
      # the fast lane should not depend on them. They are NOT, however, outside
      # the merge gate any more: `npm test`'s directory glob used to be the only
      # thing standing between CI and these files, which meant M2-01/M2-04's
      # route guarantees were never executed by CI at all. The pending-handler
      # registry this step used to describe (tests/integration/api/pending-handlers.ts
      # and its guard test) is **gone as of M2-06 (#53)**: the last stub was
      # implemented, the registry emptied, and its own rule said an empty registry
      # deletes the file with it. There are no skipped API specs to declare.
      - name: Run API route-handler suites
        run: npm run test:api

      # CI-runtime reduction (2026-10-23). Measured on runs 39886239089 (PR) and
      # 39888699197 (main): the browser download cost 152 s and 453 s respectively —
      # the same work, a 5-minute spread from network alone. Cache it and pay that
      # cost only when the Playwright version actually changes.
      #
      # The key is the exact installed version, deliberately not the lockfile hash
      # (an unrelated dependency bump would throw the cache away) and deliberately
      # without `restore-keys` (a partial browser set from another revision is worse
      # than a clean miss). `--with-deps` stays on the install so system libraries
      # are still installed on a hit; the cache holds browsers, never credentials.
      #
      # Cache scope is not symmetric: a `push` run on main writes a cache every PR can
      # restore, while a `pull_request` run writes only to refs/pull/N/merge. The first
      # run after this lands is therefore a MISS on both lanes — expected, not a failure.
      # The probe must fail the step, not just print nothing: a failed command
      # substitution inside an `echo` still exits 0, which would write an empty
      # version and poison the key with a cache every future run restores.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(npx --no-install playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "::error::Could not resolve the installed Playwright version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # M3-03 (#60): the browser gate, deliberately last. Every suite above proves a
      # contract; this one proves the thing a user can see, and it is the only job
      # that boots a **production** build (`playwright.config.ts` webServer runs
      # `npm run build && npm run start` on :3001) — which is what makes its latency numbers
      # quotable and the API suites' dev-mode numbers not.
      #
      # `--with-deps` is not optional. The first local run of this directory failed
      # with `browserType.launch` exit 127 — `libnspr4.so` / `libnss3.so` missing —
      # which is an unusable browser, not a failing test, and produced seven failures
      # that looked like product defects. GitHub's runner image does not preinstall
      # them either.
      - name: Install Playwright browsers (with system libraries)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against the production build
        run: npm run test:e2e

      # `Stop Supabase` used to run here under `if: always()`. Deleted 2026-10-23: the
      # job runs on a fresh `ubuntu-latest` VM that is destroyed with the job, so the
      # teardown cost 16-26 s per run and could not affect a later step. If local `act`
      # use ever appears, restore it as `if: always() && env.ACT`.
