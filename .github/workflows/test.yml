name: Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Job-level so every DB-backed step gets the same credentials. These were
    # previously inline on a single `npm test` step, which meant any additional
    # suite had to duplicate the whole block (and silently could not, if someone
    # forgot) — see D5 in docs/tasks/2026-09-11-intake-debt-index.md.
    env:
      # Supabase local development URLs (ADR-0003):
      #   DATABASE_URL routes through the pooler (54329), matching production.
      #   MIGRATION_DATABASE_URL connects directly as owner (54322) — the
      #   pooler requires a tenant identifier that a bare owner connection
      #   does not carry, so migrations/seeds must bypass it.
      # The app-role password is this repo's own literal from migration
      # 0001_app_authenticated_role_trigger.sql, not a Supabase-generated one,
      # so it must be kept in sync with that file. `test:api:preflight` asserts it.
      DATABASE_URL: postgresql://app_authenticated.pooler-dev:Wd7EmwRWWqY9s7jMVD3kVqnt+OaW5PowxNIxCY5Ful0=@127.0.0.1:54329/postgres
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Well-known Supabase local-dev defaults (public by design, safe to
      # commit — see .env.example). Needed by tests/integration/require-user.test.ts.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      # Pre-existing latent gap surfaced by M4-24 (#142) AC-2: the sign-in form's POST to
      # /auth/signin throws 'NEXT_PUBLIC_APP_URL must be configured' (lib/auth/magic-link.ts
      # confirmUrl()) without it — an empty-body 500. Nothing caught it because the whole
      # e2e battery authenticates via GoTrue cookies (tests/e2e/auth.ts) and no spec had
      # ever submitted the real form. Role matches .env.example (the app's own origin);
      # the port is the battery's baseURL (playwright.config.ts).
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history, deliberately. `tests/e2e/legacy-parity.spec.ts` diffs the
          # branch against `origin/main` to prove M3 touched no legacy module — and
          # checkout's default `fetch-depth: 1` leaves no `origin/main` ref and no
          # merge base in the runner at all. That is how CI proved (run 34633596241)
          # the gate as first written only ran on one machine. The spec now skips
          # loudly when no base resolves, but a *skipped* parity gate is still an
          # unwatched claim — fetch the history so it actually executes here too.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22+ needed for native WebSocket, which @supabase/supabase-js's
          # bundled realtime client requires even though this project
          # doesn't use realtime. 24 matches the local dev environment
          # (see docs/STATE.md §5, node runtime).
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Lint runs first: it needs no stack and no database, so it is the cheapest place
      # to catch a discipline break. This workflow had no lint step at all, which is how
      # `npm run lint` came to sit red with 24 `no-explicit-any` errors while
      # PROMPTKIT.md §6 forbids them — a declared control with no runner is not a
      # control. `npm run lint` now passes --max-warnings=0, so warnings fail too
      # instead of accumulating into a tolerated background hum.
      #
      # Merge note: if this lands alongside the branch that adds the API-suite step, the
      # two touch the same region of this file. Both changes are additive; keep this step
      # directly after `npm ci`.
      - name: Lint
        run: npm run lint

      - name: Start Supabase
        run: npx supabase start

      - name: Run type check
        run: npm run typecheck

      - name: Security check - Ban direct set_config calls
        run: ./scripts/check-set-config.sh

      # Separate step, before the suites, so that an environment problem is
      # attributable on its own rather than appearing as N status-code
      # assertions. This is the check that would have distinguished the
      # 2026-09-11 local incident (unfilled app-role credential -> blanket
      # HTTP 500s) from a genuine code regression.
      - name: Preflight integration environment
        run: npm run test:api:preflight

      - name: Run test suite (includes schema drift detection)
        run: npm test

      # The route-handler suites under tests/integration/api/ stay out of
      # `npm test` — they boot a `next dev` server and need the live stack, so
      # the fast lane should not depend on them. They are NOT, however, outside
      # the merge gate any more: `npm test`'s directory glob used to be the only
      # thing standing between CI and these files, which meant M2-01/M2-04's
      # route guarantees were never executed by CI at all. The pending-handler
      # registry this step used to describe (tests/integration/api/pending-handlers.ts
      # and its guard test) is **gone as of M2-06 (#53)**: the last stub was
      # implemented, the registry emptied, and its own rule said an empty registry
      # deletes the file with it. There are no skipped API specs to declare.
      - name: Run API route-handler suites
        run: npm run test:api

      # M3-03 (#60): the browser gate, deliberately last. Every suite above proves a
      # contract; this one proves the thing a user can see, and it is the only job
      # that boots a **production** build (`playwright.config.ts` webServer runs
      # `next:build && next:start` on :3001) — which is what makes its latency numbers
      # quotable and the API suites' dev-mode numbers not.
      #
      # `--with-deps` is not optional. The first local run of this directory failed
      # with `browserType.launch` exit 127 — `libnspr4.so` / `libnss3.so` missing —
      # which is an unusable browser, not a failing test, and produced seven failures
      # that looked like product defects. GitHub's runner image does not preinstall
      # them either.
      - name: Install Playwright browsers (with system libraries)
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against the production build
        run: npm run test:e2e

      - name: Stop Supabase
        run: npx supabase stop
        if: always()
